name: CI Ship

on:
  push:
    branches: ["dev"]

concurrency:
  group: ci-ship-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ship:
    uses: transummer2026/.github/.github/workflows/ci-shared-push.yml@main
    secrets:
      OTEL_ENDPOINT: ${{ secrets.OTEL_ENDPOINT }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      DISCORD_WEBHOOK_REPO: ${{ secrets.DISCORD_WEBHOOK_SHARED }}
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      SEMANTIC_TOKEN: ${{ secrets.SEMANTIC_TOKEN }}
